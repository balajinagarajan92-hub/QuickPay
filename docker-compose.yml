services:
  postgres:
    image: postgres:16
    container_name: quickpay-postgres
    environment:
      POSTGRES_DB: quickpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d

volumes:
  postgres_data: